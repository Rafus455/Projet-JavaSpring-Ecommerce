<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Index</title>
    <link rel="stylesheet" th:href="@{/css/style1.css}">
</head>
<body>

<div th:replace="~{header :: header}"></div>
    <section class="hero">
        <video class="hero-video" autoplay muted loop playsinline>
            <source th:src="@{/videos/intro.mp4}" type="video/mp4">
            Votre navigateur ne supporte pas la vidéo.
        </video>
        <div class="hero-overlay" aria-hidden="true"></div>
        <div class="hero-content">
            <h1>Bienvenue sur notre boutique</h1>
            <p>Découvrez nos produits exceptionnels</p>
            <a href="#new" class="hero-btn" style="text-decoration: none; display: inline-block;">Découvrir</a>       
        </div>
    </section>

    <section class="items-section" id="new">
        <h2>Nouveautés</h2>
        <div class="items-container" id="nouveautes">
        </div>
        <div class="separator"></div>
    </section>

    <!-- Best Items -->
    <section class="items-section" id="best">
        <h2>Meilleures ventes</h2>
        <div class="items-container" id="best-items">
        </div>
    </section>

    <footer>
        <p>&copy; 2026 SHOP - Tous droits réservés</p>
        <p>Contactez-nous : contact@shop.com</p>
    </footer>
    </body>
        <script th:src="@{/js/index.js}"></script>
    </html>
</html>
