<header th:fragment="header">
    	<link rel="stylesheet" th:href="@{/css/palette.css}">
    	<link rel="stylesheet" th:href="@{/css/header.css}">
        <div class="header-container">
            <div class="logo">
                <img class="logo" th:src="@{/images/logo.png}" alt="logo">
            </div>

            <nav class="main-nav">
                <a th:href="@{/}">Accueil</a>
                <a th:href="@{/categorie/ordinateur}">Pc Fix</a>
                <a th:href="@{/categorie/Ordinateur_de_bureau }">Ordinateur de bureau</a>
                <a th:href="@{/categorie/téléphone}">Téléphone</a>
            </nav>

            <div class="actions">
                <a th:href="@{/admin/dashboard}" id="admin-link" th:style="${isAdmin} ? '' : 'display:none;'" >
                 	<div class="icon">
                		<img th:src="@{/images/admin.png}" alt="Admin">
                	</div>
                </a>
                <a th:href="@{/account}">
                	<div class="icon">
                		<img th:src="@{/images/user.png}" alt="Utilisateur">
                	</div>
                </a>
                <a th:href="@{/panier}">
                    <div class="icon">
                		<img th:src="@{/images/panier.png}" alt="Panier">
                    </div>
                </a>
            </div>
        </div>
</header>

<script>
;(function(){
    try {
        const token = localStorage.getItem('jwt');
        if (!token) return;
        const parts = token.split('.');
        if (parts.length !== 3) return;
        const payload = parts[1].replace(/-/g, '+').replace(/_/g, '/');
        const pad = payload.length % 4;
        const padded = payload + (pad ? '='.repeat(4 - pad) : '');
        const json = JSON.parse(atob(padded));
        const role = json.role || json.Roles || json.roles;
        if (!role) return;
        if (typeof role === 'string' && role.toUpperCase().includes('ADMIN')) {
            const el = document.getElementById('admin-link');
            if (el) el.style.display = '';
        }
    } catch (e) {

    }
})();
</script>
