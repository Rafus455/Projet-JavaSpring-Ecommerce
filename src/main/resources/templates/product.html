<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Présentation du produit</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="product-card">
        <div class="product-image">
            <img src="https://www.yesss-fr.com/produits/89218/photos/89218-NSYSDH.jpg" alt="Image du produit">
        </div>

        <div class="product-info">
            <h1 class="product-title">Nom du produit</h1>

            <p class="product-description">
                Voici une description claire et concise du produit.
                Elle explique ses avantages, son utilité et ce qui le rend unique.
            </p>

            <div class="product-price">
                49,99 €
            </div>

            <button class="product-button">
                Ajouter au panier
            </button>
        </div>
    </div>

</body>
</html>
