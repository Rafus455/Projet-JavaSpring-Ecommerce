<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${category.name} + ' | SHOP'">Catégorie</title>
    <link rel="stylesheet" th:href="@{/css/categorie.css}">
    
</head>
<body>

<div th:replace="header :: header"></div>

<div class="breadcrumb">
    <a th:href="@{/index}">Accueil</a> /
    <span th:text="${category.name}">Catégorie</span>
</div>

<div class="page-header">
    <h1 th:text="${category.name}">Ordinateurs</h1>
    <p th:text="${category.description}">
        Découvrez notre sélection de produits
    </p>
</div>

<div class="main-container">

    <aside class="sidebar">

        <div class="filter-section">
            <h3>Prix</h3>
            <div class="price-inputs">
                <input type="number" placeholder="Min">
                <span>-</span>
                <input type="number" placeholder="Max">
            </div>
        </div>

        <div class="filter-section">
            <h3>Type</h3>
            <label><input type="checkbox"> Gaming</label>
            <label><input type="checkbox"> Bureau</label>
            <label><input type="checkbox"> Portable</label>
        </div>

        <button class="apply-filters-btn">Appliquer les filtres</button>
    </aside>

    <div class="products-section">

        <!-- TOOLBAR -->
        <div class="toolbar">
            <div class="results-count">
                <strong th:text="${#lists.size(products)} + ' produits'">
                    0 produits
                </strong>
            </div>

            <div class="sort-options">
                <label>Trier par :</label>	
                <select>
                    <option>Pertinence</option>
                    <option>Prix croissant</option>
                    <option>Prix décroissant</option>
                    <option>Nouveautés</option>
                </select>
            </div>
        </div>

        <div class="products-grid">

            <!-- PRODUIT -->
            <div class="product-card" th:each="product : ${products}">
              <a th:href="@{/produit/{id}(id=${product.id})}">
				
                <div class="product-image">
					<img th:src="@{${product.pathImage}}" alt="Produit">
                    <span class="product-badge new"
                          th:if="true">
                        Nouveau
                    </span>
                </div>
               </a>

                <div class="product-info">
                    <div class="product-category"
                         th:text="${category.name}">x	
                    </div>

                    <h3 class="product-name"
                        th:text="${product.name}">
                        Nom produit
                    </h3>

                    <p class="product-specs"
                       th:text="${product.description}">
                        Description produit
                    </p>

                    <div class="product-bottom">
                        <div>
                            <div class="product-price">
                                 <span th:text="${product.price}">0.00 €</span>
                            </div>
                        </div>

                        <a th:href="@{/panier}"
                           class="add-to-cart-icon">
                            🛒
                        </a>
                    </div>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(products)}">
                <p>Aucun produit dans cette catégorie.</p>
            </div>

        </div>

    </div>
</div>

		<footer>
		    <p>&copy; 2026 SHOP - Tous droits réservés</p>
		    <p>Contact : contact@shop.com</p>
		</footer>

</body>
</html>
