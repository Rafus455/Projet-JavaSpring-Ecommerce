<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${category.name} + ' | SHOP'">Catégorie</title>
    <link rel="stylesheet" th:href="@{/css/categorie.css}">
    
    <style>
        
    </style>
</head>
<body>

<div th:replace="~{header :: header}"></div>
<div class="breadcrumb">
    <a th:href="@{/}">Accueil</a> /
    <span th:text="${category.name}">Catégorie</span>
</div>

<div class="page-header">
    <h1 th:text="${category.name.replace('_', ' ')}">Ordinateurs</h1>
    <p th:text="${category.description}">
        Découvrez notre sélection de produits
    </p>
</div>

<div class="main-container">

    <aside class="sidebar">
	    <form th:action="@{/categorie/id/{id}(id=${category.id})}" method="get">
	        
	        <div class="filter-section">
	            <h3>Prix</h3>
	            <div class="price-inputs">
	                <input type="number" name="min" placeholder="Min" th:value="${param.min}">
	                <span>-</span>
	                <input type="number" name="max" placeholder="Max" th:value="${param.max}">
	            </div>
	        </div>
	
	        <div class="filter-section">
			    <h3>Type</h3>
			    <label>
			        <input type="checkbox" 
			               onclick="window.location.href='/categorie/ordinateur'"
			               th:checked="${category.name == 'ordinateur'}">
			        Pc Fix
			    </label>
			
			    <label>
			        <input type="checkbox" 
			               onclick="window.location.href='/categorie/Ordinateur_de_bureau'"
			               th:checked="${category.name == 'Ordinateur_de_bureau'}"> 
			        Ordinateur de bureau
			    </label>
			
			    <label>
			        <input type="checkbox" 
			               onclick="window.location.href='/categorie/téléphone'"
			               th:checked="${category.name == 'téléphone'}"> 
			        Téléphone
			    </label>
			</div>
			
			<div class="filter-section">
			    <h3>Filtrer par :</h3>
			    <label>
			        <input type="checkbox" name="nouveau" 
			               value="true" 
			               th:checked="${param.nouveau != null}"> 
			        Nouveauté
			    </label>
			    <label>
			        <input type="checkbox" name="rupture" 
			               value="true" 
			               th:checked="${param.rupture != null}"> 
			        Rupture de stock
			    </label>
			</div>
	
	        <button type="submit" class="apply-filters-btn">Appliquer les filtres</button>
	    
	    </form>

	</aside>

    <div class="products-section">

        <!-- TOOLBAR -->
        <div class="toolbar">
            <div class="results-count">
                <strong th:text="${#lists.size(products)} + ' produits'">
                    0 produits
                </strong>
            </div>

            <div class="sort-options">
                <label>Trier par :</label>	
                <select>
                    <option>Prix croissant</option>
                    <option>Prix décroissant</option>
                </select>
            </div>
        </div>

        <div class="products-grid">

            <div class="product-card" th:each="product : ${products}">
              <a th:href="@{/produit/{id}(id=${product.id})}">
				
                <div class="product-image">
				    <img th:src="@{${product.pathImage}}" alt="Produit">
				    
				    <span class="product-badge out"
				          th:if="${product.stock == 0}">
				        Rupture
				    </span>
					<span class="product-badge new"
				          th:if="${product.stock > 0 and product.new}">
				        Nouveau
				    </span>
				</div>
               </a>

                <div class="product-info">
                    <div class="product-category"	
                         th:text="${category.name}">Catégorie	
                    </div>

                    <h3 class="product-name"
                        th:text="${product.name}">
                        Nom produit
                    </h3>

                    <p class="product-specs"
                       th:text="${product.description}">
                        Description produit
                    </p>

                    <div class="product-bottom">
                        <div>
                            <div class="product-price">
                                 <span th:text="${product.price} + ' € '"></span>
                            </div>
                        </div>

                        <a href="#"
                           class="add-to-cart-icon"
                           th:if="${product.stock > 0}"
						   th:data-id="${product.id}"
						   th:data-name="${product.name}"
						   th:data-category="${category.name}"
						   th:data-price="${product.price}"
						   th:data-orderItemId=${orderItemId}
						   th:data-pathimage=${product.pathImage}
						   onclick="addToCart(this)">
						   🛒
						</a>
                        <span class="add-to-cart-icon" 
                              style="background-color: #ccc; cursor: not-allowed;"
                              th:if="${product.stock == 0}">
                            🚫
                        </span>
                    </div>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(products)}">
                <p>Aucun produit dans cette catégorie.</p>
            </div>

        </div>

    </div>
</div>

<footer>
    <p>&copy; 2026 SHOP - Tous droits réservés</p>
    <p>Contact : contact@shop.com</p>
</footer>

    <script th:src="@{/js/categorie.js}"></script>

</body>
</html>
