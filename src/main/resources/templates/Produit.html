<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Détail Produit</title>
    <link rel="stylesheet" th:href="@{/css/produit.css}">
    <style>
        /* Ajout de sécurité pour le badge rouge */
        .product-badge.out {
            background-color: #e74c3c !important;
        }
    </style>
</head>
<body>

	<div th:replace="header :: header"></div>
	
	<div class="breadcrumb">
        <a th:href="@{/}">Accueil</a> / <a th:href="@{/categorie/ordinateur}">Ordinateurs</a> / <div th:text="${product.name}"></div>
    </div>

    <div class="product-container">
        <div class="product-images">
            <div class="main-image-container">
                <div class="main-image">
                    <img th:src="@{${product.pathImage}}" alt="Produit">
                    
                    <span class="product-badge out" th:if="${product.stock == 0}">Rupture</span>
                    <span class="product-badge new" th:if="${product.stock > 0}">Nouveau</span>
                    
                </div>
            </div>
        </div>

        <div class="product-info">
            <div class="product-category">Gaming</div>
            <div class="product-category" th:text="${product.name}">x</div>            
            
            <div class="product-rating">
                <span class="stars">★★★★★</span>
            </div>

            <div class="product-price-section">
                <div class="product-price">
                	<span th:text="${product.price}">0.00 €</span>
                </div>
            </div>

            <p class="product-specs" th:text="${product.description}">
                Description produit
            </p>

            <div class="quantity-selector">
                <label>Quantité :</label>
                <div class="quantity-controls">
                    <button class="quantity-btn" onclick="decrementQuantity()">-</button>
                    <input type="number" class="quantity-input" id="quantity" value="1" min="1">
                    <button class="quantity-btn" onclick="incrementQuantity()">+</button>
                </div>
            </div>
            
           <div class="stock-section">
			    <span class="stock-label">Stock disponible :</span>
                <!-- Gestion de la couleur du stock (Vert ou Rouge) -->
			     <span class="stock-value" 
			          th:text="${product.stock}"
			          th:classappend="${product.stock == 0} ? 'out' : ''">
			        0
			    </span>
			</div>

            <div class="action-buttons">
                <button class="add-to-cart-btn" 
				        th:disabled="${product.stock == 0}"
				        th:style="${product.stock == 0} ? 'opacity: 0.5; cursor: not-allowed;' : ''">
				    🛒 Ajouter au panier
				</button>
                <button class="buy-now-btn">Acheter maintenant</button>
            </div>

            <div class="product-features">
                <div class="feature-item">
                    <span class="feature-icon">🚚</span>
                    <span class="feature-text">Livraison gratuite</span>
                </div>
                <div class="feature-item">
                    <span class="feature-icon">↩️</span>
                    <span class="feature-text">Retour sous 30 jours</span>
                </div>
                <div class="feature-item">
                    <span class="feature-icon">🛡️</span>
                    <span class="feature-text">Garantie 2 ans</span>
                </div>
                <div class="feature-item">
                    <span class="feature-icon">💳</span>
                    <span class="feature-text">Paiement sécurisé</span>
                </div>
            </div>
        </div>
    </div>
	
    <section class="tabs-section">
        <div class="tabs">
            <button class="tab active" onclick="openTab(event, 'description')">Description</button>
        </div>
      </section>

    <footer>
        <p>&copy; 2026 SHOP - Tous droits réservés</p>
        <p>Contactez-nous : contact@shop.com</p>
    </footer>

    <script>
        function incrementQuantity() {
            const input = document.getElementById('quantity');
            input.value = parseInt(input.value) + 1;
        }

        function decrementQuantity() {
            const input = document.getElementById('quantity');
            if (input.value > 1) {
                input.value = parseInt(input.value) - 1;
            }
        }

        function openTab(evt, tabName) {
            const tabPanels = document.getElementsByClassName('tab-panel');
            for (let i = 0; i < tabPanels.length; i++) {
                tabPanels[i].classList.remove('active');
            }
            
            const tabs = document.getElementsByClassName('tab');
            for (let i = 0; i < tabs.length; i++) {
                tabs[i].classList.remove('active');
            }
            
            // J'ai corrigé "currentTarxget" en "currentTarget" ci-dessous
            document.getElementById(tabName).classList.add('active');
            evt.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
