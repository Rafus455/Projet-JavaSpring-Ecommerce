<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Index</title>
    <link rel="stylesheet" th:href="@{/css/produit.css}">
	    											
</head>
<body>

	<div th:replace="header :: header"></div>
	
	<div class="breadcrumb">
        <a href="#home">Accueil</a> / <a href="#computers">Ordinateurs</a> / <div th:text="${product.name}"></div>
    </div>

    <div class="product-container">
        <div class="product-images">
            <div class="main-image-container">
                <div class="main-image">
                <img th:src="@{${product.pathImage}}" alt="Produit">
                    <span class="product-badge new"
                          th:if="true">
                        Nouveau
                    </span>
                </div>
            </div>
        </div>

        <div class="product-info">
            <div class="product-category">Gaming</div>
					<div class="product-category"
                         th:text="${product.name}">x	
                    </div>            
            <div class="product-rating">
                <span class="stars">★★★★★</span>
            </div>

            <div class="product-price-section">
                <div class="product-price">
                	<span th:text="${product.price}">0.00 €</span>
                </div>
            </div>

            <p class="product-specs"
                       th:text="${product.description}">
                        Description produit
                    </p>
            <div class="quantity-selector">
                <label>Quantité :</label>
                <div class="quantity-controls">
                    <button class="quantity-btn" onclick="decrementQuantity()">-</button>
                    <input type="number" class="quantity-input" id="quantity" value="1" min="1">
                    <button class="quantity-btn" onclick="incrementQuantity()">+</button>
                </div>
            </div>

            <div class="action-buttons">
                <button class="add-to-cart-btn">
                    🛒 Ajouter au panier
                </button>
                <button class="buy-now-btn">Acheter maintenant</button>
            </div>

            <div class="product-features">
                <div class="feature-item">
                    <span class="feature-icon">🚚</span>
                    <span class="feature-text">Livraison gratuite</span>
                </div>
                <div class="feature-item">
                    <span class="feature-icon">↩️</span>
                    <span class="feature-text">Retour sous 30 jours</span>
                </div>
                <div class="feature-item">
                    <span class="feature-icon">🛡️</span>
                    <span class="feature-text">Garantie 2 ans</span>
                </div>
                <div class="feature-item">
                    <span class="feature-icon">💳</span>
                    <span class="feature-text">Paiement sécurisé</span>
                </div>
            </div>
        </div>
    </div>
	
    <section class="tabs-section">
        <div class="tabs">
            <button class="tab active" onclick="openTab(event, 'description')">Description</button>
        </div>
        
        <div class="tab-content">
            <div id="description" class="tab-panel active">
               <p class="product-specs"
                       th:text="${product.description}">
                        Description produit
                    </p>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 SHOP - Tous droits réservés</p>
        <p>Contactez-nous : contact@shop.com</p>
    </footer>

    <script>
        function incrementQuantity() {
            const input = document.getElementById('quantity');
            input.value = parseInt(input.value) + 1;
        }

        function decrementQuantity() {
            const input = document.getElementById('quantity');
            if (input.value > 1) {
                input.value = parseInt(input.value) - 1;
            }
        }

        function openTab(evt, tabName) {
            const tabPanels = document.getElementsByClassName('tab-panel');
            for (let i = 0; i < tabPanels.length; i++) {
                tabPanels[i].classList.remove('active');
            }
            
            const tabs = document.getElementsByClassName('tab');
            for (let i = 0; i < tabs.length; i++) {
                tabs[i].classList.remove('active');
            }
            
            document.getElementById(tabName).classList.add('active');
            evt.currentTarget.classList.add('active');
        }
